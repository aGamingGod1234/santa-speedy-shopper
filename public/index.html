<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa's Speedy Shopper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ Page shell (outside the 1080x960 frame) ============ */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #1b1d22; color: #eceef2; font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
body.record { background: #000; }
.toolbar {
  position: fixed; inset: 0 0 auto 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 16px; background: #25282f; border-bottom: 1px solid #343843;
}
body.clean .toolbar { display: none; }
.toolbar .group { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.toolbar button { font: inherit; color: #eceef2; background: #31353f; border: 1px solid #3d424e; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.toolbar button:hover { background: #3a3f4b; }
.toolbar button[aria-pressed="true"] { background: #ffd36b; color: #1b1d22; border-color: #ffd36b; font-weight: 600; }
.toolbar kbd { font: 11px ui-monospace, monospace; opacity: .7; margin-left: 4px; }
.toolbar input { font: inherit; color: #eceef2; background: #1b1d22; border: 1px solid #3d424e; border-radius: 8px; padding: 6px 10px; width: min(520px, 60vw); }
.toolbar .note { color: #9aa0ab; font-size: 12px; margin-left: auto; }
.stage { position: fixed; left: 0; right: 0; bottom: 0; top: var(--toolbar-h, 56px); }
body.clean .stage { top: 0; }
.frame-wrap { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; transform-origin: 0 0; }

/* ============ Frame: 1080x960, the bottom half of the 9:16 video ============
   Key UI stays in x 24..960, y 20..700: X/Reels cover the right 120px and the bottom of the 9:16 frame. */
.frame {
  --ink: #2b1a10; --muted: #7b5a43; --paper: #fffaf0; --red: #d8382c; --green: #2f7f50; --yellow: #f4b630;
  --shadow: 5px 7px 0 rgba(70,30,10,.32);
  --img: 124px;
  position: relative; width: 1080px; height: 960px; overflow: hidden;
  display: flex; flex-direction: column; padding: 20px 120px 0 24px;
  color: var(--ink); font-family: "Fredoka", sans-serif;
  background:
    radial-gradient(circle at 20px 20px, rgba(255,255,255,.16) 6px, transparent 7px) 0 0 / 80px 80px,
    radial-gradient(circle at 60px 60px, rgba(120,60,20,.10) 6px, transparent 7px) 0 0 / 80px 80px,
    #c99a64;
}

/* top bar: provider switch, gift count, timer */
.top { flex: none; height: 112px; display: flex; align-items: center; gap: 18px; position: relative; }
.spacer { flex: 1; }
.count { font: 700 32px/1 "Fredoka"; background: var(--paper); padding: 14px 24px; border-radius: 999px; box-shadow: var(--shadow); white-space: nowrap; font-variant-numeric: tabular-nums; }
.timer { flex: none; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); font: 700 40px/1 "Fredoka"; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); transform: rotate(6deg); }
.prov-slow .timer { background: #e9dcc6; }
.timer .tl { display: none; }
/* countdown mode (K): "Christmas in 2:00" clock; the run seconds move to the count pill */
.countdown .timer { width: auto; min-width: 176px; height: 120px; padding: 10px 22px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transform: rotate(3deg); }
.countdown .timer .tl { display: block; font: 700 32px/1 "Caveat"; color: var(--red); white-space: nowrap; }
.countdown .timer .t { font: 700 56px/1 "Fredoka"; }
.countdown .count { padding: 12px 20px; font-size: 30px; }
.count .secs { color: var(--red); }

/* provider switch (S) */
.switch { position: relative; flex: none; display: flex; align-items: center; gap: 16px; height: 100px; padding: 0 26px 0 16px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); transform: rotate(1.5deg); }
.track { position: relative; flex: none; width: 92px; height: 50px; border-radius: 25px; background: #cbbba5; box-shadow: inset 0 4px 0 rgba(70,30,10,.22); transition: background .25s; }
.knob { position: absolute; top: 5px; left: 5px; width: 40px; height: 40px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 rgba(70,30,10,.3); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.flip { position: relative; width: 290px; height: 88px; perspective: 600px; }
.flipper { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .25s cubic-bezier(.3,1.45,.5,1); }
.side { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.side.back { transform: rotateX(180deg); }
.side small { font: 700 34px/1 "Caveat"; color: var(--muted); white-space: nowrap; }
.side b { font: 700 42px/1 "Fredoka"; white-space: nowrap; }
.side.front b { color: #8a7560; }
.side.back b { color: var(--green); }
.prov-fast .track { background: var(--green); }
.prov-fast .knob { transform: translateX(42px); }
.prov-fast .flipper { transform: rotateX(180deg); }
.frame.instant .track, .frame.instant .knob, .frame.instant .flipper { transition: none !important; }
.switch.stamp { animation: switchStamp .3s cubic-bezier(.2,1.7,.4,1); }
@keyframes switchStamp { 0% { transform: scale(1.2) rotate(-5deg); } 100% { transform: rotate(1.5deg); } }
.timer.reset { animation: timerReset .3s cubic-bezier(.2,1.8,.4,1); }
@keyframes timerReset { 0% { transform: scale(1.35) rotate(-20deg); } 100% { transform: rotate(6deg); } }

/* "same list, resent" tag under the switch */
.resent { position: absolute; z-index: 6; left: 150px; top: 104px; padding: 8px 18px 9px; border-radius: 10px; background: var(--yellow); color: var(--ink); font: 700 32px/1 "Caveat"; white-space: nowrap; box-shadow: 3px 4px 0 rgba(70,30,10,.3); transform: rotate(-3deg); opacity: 0; pointer-events: none; }
.resent.show { animation: resentIn 2.6s cubic-bezier(.2,1.7,.4,1) both; }
@keyframes resentIn { 0% { opacity: 0; transform: scale(1.8) rotate(-18deg); } 10% { opacity: 1; transform: rotate(-3deg); } 85% { opacity: 1; transform: rotate(-3deg); } 100% { opacity: 0; transform: rotate(-3deg); } }

/* DONE stamp: lands on the frame when a run finishes, with the measured time */
/* sits in the empty 6th slot (right column, bottom row) so it never covers the clock, transcript or gifts */
.done { position: absolute; z-index: 7; left: 600px; top: 618px; display: flex; flex-direction: column; align-items: center; padding: 10px 26px 12px; border: 6px solid var(--red); border-radius: 14px; background: rgba(255,250,240,.92); color: var(--red); transform: rotate(-8deg); opacity: 0; pointer-events: none; box-shadow: 3px 4px 0 rgba(70,30,10,.3); }
.done b { font: 700 64px/1 "Fredoka"; letter-spacing: .06em; }
.done span { font: 700 34px/1 "Caveat"; color: var(--ink); white-space: nowrap; }
.prov-slow .done { border-color: #8a7560; color: #8a7560; }
.done.show { animation: doneIn .35s cubic-bezier(.2,1.8,.4,1) both; }
@keyframes doneIn { from { opacity: 0; transform: scale(2.4) rotate(-30deg); } to { opacity: 1; transform: rotate(-8deg); } }
.state-end .done { display: none; }
.card.is-filled { cursor: pointer; }

/* transcript strip (T): what you said, live */
.strip { display: none; flex: none; height: 72px; margin-top: 16px; padding: 0 24px; gap: 16px; align-items: center; overflow: hidden; background: var(--paper); border-radius: 18px; box-shadow: var(--shadow); }
.frame.show-strip .strip { display: flex; }
.strip .mic { flex: none; width: 24px; height: 24px; border-radius: 50%; background: #c9b9a4; }
.frame.is-listening .strip .mic { background: var(--red); animation: micDot 1s ease-in-out infinite; }
@keyframes micDot { 50% { box-shadow: 0 0 0 8px rgba(216,56,44,.2); } }
.strip .line { flex: 1; min-width: 0; display: flex; overflow: hidden; }
.strip .line.overflow { justify-content: flex-end; -webkit-mask-image: linear-gradient(90deg, transparent, #000 90px); mask-image: linear-gradient(90deg, transparent, #000 90px); }
.strip .words { margin: 0; white-space: nowrap; font: 600 38px/1 "Fredoka"; }
.strip .words.error { color: var(--red); font-size: 30px; }
.state-end .strip { display: none !important; }

/* end band (E) replaces the top bar */
.result { display: none; flex: none; height: 232px; align-items: center; gap: 34px; padding-left: 10px; }
.state-end .top { display: none; }
.state-end .result { display: flex; }
.big { font: 700 200px/.8 "Fredoka"; color: #fff; text-shadow: 7px 9px 0 var(--red), 13px 18px 0 rgba(70,30,10,.3); transform: rotate(-3deg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.vs { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; max-width: 420px; background: var(--paper); padding: 18px 26px 20px; border-radius: 18px; box-shadow: var(--shadow); transform: rotate(2deg); }
.vs b { font: 700 54px/1 "Fredoka"; color: var(--red); }
.vs span { font: 700 34px/1.05 "Caveat"; color: var(--muted); }
.state-end .big { animation: bigIn .55s cubic-bezier(.2,1.6,.4,1) both; }
.state-end .vs { animation: vsIn .4s .25s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes bigIn { from { transform: rotate(-20deg) scale(.4); opacity: 0; } to { transform: rotate(-3deg); opacity: 1; } }
@keyframes vsIn { from { transform: rotate(10deg) scale(.6); opacity: 0; } to { transform: rotate(2deg); opacity: 1; } }
.state-end { --img: 104px; }

/* gift tags: 2 columns x 3 rows, ends by y 700 */
.grid {
  flex: 1; min-height: 0; margin-top: 18px; margin-bottom: 8px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr);
  gap: 18px 20px; padding: 4px 4px 0;
}
.card {
  position: relative; min-width: 0; min-height: 0;
  display: grid; grid-template-columns: var(--img) minmax(0, 1fr); column-gap: 24px;
  grid-template-rows: repeat(3, max-content); grid-template-areas: "img who" "img name" "img store";
  align-content: center; align-items: center; padding: 10px 14px;
  border-radius: 16px; border: 4px dashed rgba(255,250,240,.6); background: rgba(255,250,240,.12);
  transform: rotate(var(--rot));
}
.card:nth-child(4n+1) { --rot: -1.1deg; } .card:nth-child(4n+2) { --rot: .9deg; }
.card:nth-child(4n+3) { --rot: .7deg; } .card:nth-child(4n) { --rot: -1deg; }
.card.is-filled, .card.is-loading { background: var(--paper); border: 4px solid transparent; box-shadow: 5px 7px 0 rgba(70,30,10,.32); }
.tape { position: absolute; top: -14px; left: 50%; width: 110px; height: 28px; margin-left: -55px; background: rgba(255,240,200,.8); transform: rotate(-3deg); box-shadow: 0 1px 2px rgba(0,0,0,.1); opacity: 0; z-index: 3; }
.card.is-filled .tape { opacity: 1; }
.who { grid-area: who; font: 700 42px/1 "Caveat"; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: capitalize; }
.card.is-filled .who, .card.is-loading .who { color: var(--red); }
.img { grid-area: img; position: relative; width: var(--img); height: var(--img); border-radius: 12px; display: grid; place-items: center; border: 4px dashed rgba(255,250,240,.45); }
.card.is-filled .img, .card.is-loading .img { border: 0; background: #fff; }
.img img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; opacity: 0; }
.card.is-filled .img img { opacity: 1; }
.card.is-filled .img.noimg img { display: none; }
.card.is-filled .img.noimg::after { content: "🎁"; font-size: 64px; }
.sticker { position: absolute; right: -14px; bottom: -16px; min-width: 74px; height: 50px; padding: 0 12px; border-radius: 25px; display: grid; place-items: center; background: var(--red); color: #fff; font: 700 28px/1 "Fredoka"; white-space: nowrap; box-shadow: 3px 4px 0 rgba(70,30,10,.3); transform: rotate(-8deg); opacity: 0; z-index: 2; }
.card:nth-child(even) .sticker { background: var(--green); }
.card.is-filled .sticker { opacity: 1; }
.name { grid-area: name; font: 600 32px/1.12 "Fredoka"; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.store { grid-area: store; font: 500 26px/1.15 "Fredoka"; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.state-end .name { -webkit-line-clamp: 1; font-size: 28px; }
.card:not(.is-filled) .name, .card:not(.is-filled) .store { color: transparent; border-radius: 10px; background: rgba(255,250,240,.3); }
.card:not(.is-filled) .name { width: 88%; height: 30px; margin-top: 10px; }
.card:not(.is-filled) .store { width: 52%; height: 22px; margin-top: 8px; }
.card.is-loading .name, .card.is-loading .img::before {
  background: linear-gradient(90deg, #efe3cf 30%, #fffaf0 50%, #efe3cf 70%) !important;
  background-size: 300% 100% !important; animation: shimmer 1.1s linear infinite;
}
.card.is-loading .img::before { content: ""; position: absolute; inset: 0; border-radius: 12px; }
.searching { display: none; grid-area: store; align-items: center; gap: 10px; font: 700 34px/1 "Caveat"; color: var(--muted); white-space: nowrap; }
.card.is-loading .searching { display: flex; }
.card.is-loading .store { display: none; }
.spinner { width: 26px; height: 26px; border-radius: 50%; border: 4px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
.card.land { animation: cLand .38s cubic-bezier(.25,1.5,.45,1) both; }
.card.land .sticker { animation: stamp .3s .14s cubic-bezier(.2,1.8,.4,1) both; }
.card.land .img img { animation: pop .34s .06s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes cLand { from { transform: translateY(-80px) rotate(calc(var(--rot) - 8deg)) scale(1.06); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(var(--rot)); opacity: 1; } }
@keyframes stamp { from { transform: scale(2.2) rotate(-40deg); opacity: 0; } to { transform: rotate(-8deg); opacity: 1; } }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
.card.poof { animation: poof .22s ease-in both; }
@keyframes poof { to { transform: rotate(var(--rot)) scale(.85); opacity: 0; } }

/* bottom band (covered by captions in the 9:16 frame): brand + progress only */
.foot { flex: none; height: 200px; display: flex; align-items: flex-start; gap: 24px; padding-top: 34px; }
.brand { flex: none; display: flex; align-items: center; gap: 12px; white-space: nowrap; font: 700 30px/1 "Fredoka"; color: #fff; background: var(--red); padding: 12px 24px 12px 20px; border-radius: 10px; transform: rotate(-2deg); box-shadow: var(--shadow); }
.brand-mark { width: 22px; height: 22px; background: var(--yellow); border-radius: 5px; transform: rotate(45deg); }
.progress { position: relative; flex: 1; height: 24px; margin-top: 14px; border-radius: 12px; overflow: hidden; background: rgba(70,30,10,.18); }
.progress i { position: absolute; inset: 0 auto 0 0; width: 0%; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, #fff 12px 24px); transition: width .18s ease-out; }
.frame.reduced *, .frame.reduced *::before, .frame.reduced *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition: none !important; }
</style>
</head>
<body>
<div class="toolbar" id="toolbar">
  <div class="group">
    <button id="micBtn">Talk / send<kbd>Space</kbd></button>
    <button id="againBtn">Send again<kbd>Enter</kbd></button>
    <button id="prov">Switch provider<kbd>S</kbd></button>
    <button id="endBtn" aria-pressed="false">End card<kbd>E</kbd></button>
    <button id="cdBtn" aria-pressed="false">Countdown<kbd>K</kbd></button>
    <button id="stripBtn" aria-pressed="true">Transcript<kbd>T</kbd></button>
    <button id="resetBtn">Reset<kbd>R</kbd></button>
  </div>
  <div class="group"><input id="typed" placeholder="Or type the list and press Enter: mom loves coffee, dad likes music…"></div>
  <span class="note">H hides this bar. ?record=1 = exact 1080x960 px.</span>
</div>

<div class="stage" id="stage">
  <div class="frame-wrap" id="wrap">
    <div class="frame" id="frame">
      <header class="top">
        <div class="switch" id="switch">
          <span class="track"><span class="knob"></span></span>
          <span class="flip"><span class="flipper">
            <span class="side front"><small class="modelName"></small><b id="slowLabel"></b></span>
            <span class="side back"><small class="modelName"></small><b id="fastLabel"></b></span>
          </span></span>
        </div>
        <span class="spacer"></span>
        <span class="count" id="count"></span>
        <span class="timer" id="timer"><small class="tl">Christmas in</small><span class="t" id="timerT">0.0s</span></span>
        <span class="resent" id="resent">same list, resent</span>
      </header>
      <div class="done" id="done"><b>DONE</b><span id="doneTime"></span></div>
      <div class="strip"><span class="mic"></span><div class="line" id="line"><p class="words" id="words"></p></div></div>
      <section class="result">
        <div class="big" id="big"></div>
        <div class="vs"><b id="vsnum"></b><span id="vsline"></span><span id="allline"></span></div>
      </section>
      <main class="grid" id="grid"></main>
      <footer class="foot">
        <div class="brand"><span class="brand-mark"></span>Santa's Speedy Shopper</div>
        <div class="progress"><i id="bar"></i></div>
      </footer>
    </div>
  </div>
</div>

<script>
// Real app: what you say goes to OpenClaw (santa agent, Kimi K3.1 Pro) through server.mjs; gift lines stream back
// and each card lands when its line arrives. Every product, price, store and link comes from a live search.
const CFG = {
  model: 'Kimi K3.1 Pro',
  providers: { slow: { id: 'moonshot', label: 'Moonshot API' }, fast: { id: 'cerebras', label: 'Cerebras' } },
  slots: 5,
  countdownStart: 120,   // "Christmas in 2:00"
};

const $ = id => document.getElementById(id);
const frame = $('frame'), grid = $('grid'), wordsEl = $('words'), lineEl = $('line'), timerEl = $('timer'), countEl = $('count'), bar = $('bar'), sw = $('switch');
document.querySelectorAll('.modelName').forEach(e => e.textContent = CFG.model);
$('slowLabel').textContent = CFG.providers.slow.label;
$('fastLabel').textContent = CFG.providers.fast.label;

let provider = 'slow', running = false, lastText = '', lastSentOn = null, abortRun = null;
let strip = true, countdown = false, reduced = false, endShown = false;
let runT0 = 0, runSec = 0, runRaf = 0;
let cdT0 = null, cdFrozen = null, cdRaf = 0;
const times = { slow: null, fast: null };   // seconds for the last complete run on each side
let cards = [];

const fmt = sec => sec == null ? '–' : sec < 10 ? sec.toFixed(1) + 's' : Math.round(sec) + 's';
const fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ---------- cards ----------
function buildCards(n) {
  grid.innerHTML = Array.from({ length: n }, () => `
    <article class="card">
      <span class="tape"></span>
      <div class="who"></div>
      <div class="img"><img alt=""><span class="sticker"></span></div>
      <div class="name">&nbsp;</div>
      <div class="store">&nbsp;</div>
      <span class="searching"><span class="spinner"></span>Searching…</span>
    </article>`).join('');
  cards = [...grid.children];
  grid.style.gridTemplateRows = `repeat(${Math.ceil(n / 2)}, minmax(0, 1fr))`;
}
const filled = () => cards.filter(c => c.classList.contains('is-filled')).length;
function setCount() {
  const n = filled();
  const secs = countdown && (running || runSec) ? ` · <span class="secs">${fmt(runSec)}</span>` : '';
  countEl.innerHTML = `${n} of ${cards.length} gifts${secs}`;
  bar.style.width = (n / cards.length * 100) + '%';
}
function fill(g) {
  let i = cards.findIndex(c => !c.classList.contains('is-filled'));
  if (i < 0) { buildMore(); i = cards.length - 1; }
  const c = cards[i];
  c.querySelector('.who').textContent = g.who;
  const img = c.querySelector('img'), box = c.querySelector('.img');
  box.classList.toggle('noimg', !g.image);
  img.onerror = () => box.classList.add('noimg');   // some stores' image links are dead
  if (g.image) img.src = g.image; else img.removeAttribute('src');
  const amount = parseFloat(g.price.replace(/[^\d.]/g, ''));
  c.querySelector('.sticker').textContent = Number.isFinite(amount) ? '$' + Math.round(amount) : g.price;
  c.querySelector('.name').textContent = g.name;
  c.querySelector('.store').textContent = g.store;
  c.title = g.url;
  c.dataset.url = g.url;
  c.className = 'card is-filled land';
  setCount();
}
function buildMore() {   // more people than slots: add a card without disturbing the filled ones
  const c = cards[0].cloneNode(true); c.className = 'card'; grid.appendChild(c); cards = [...grid.children];
  grid.style.gridTemplateRows = `repeat(${Math.ceil(cards.length / 2)}, minmax(0, 1fr))`;
}
function clearCards(animate) {
  if (animate) cards.forEach(c => { if (c.className !== 'card') c.classList.add('poof'); });
  setTimeout(() => { buildCards(CFG.slots); setCount(); }, animate ? 220 : 0);
}

// ---------- timers ----------
function showTimer() {
  if (countdown) {
    const left = cdFrozen ?? (cdT0 == null ? CFG.countdownStart : CFG.countdownStart - (performance.now() - cdT0) / 1000);
    $('timerT').textContent = fmtClock(left);
  } else $('timerT').textContent = fmt(runSec);
}
function startCountdown() {   // starts once, on the first time you talk or send; keeps going through the switch
  if (cdT0 != null) return;
  cdT0 = performance.now();
  const tick = () => { showTimer(); if (cdFrozen == null) cdRaf = requestAnimationFrame(tick); };
  tick();
}
function startRunTimer() {
  runT0 = performance.now(); runSec = 0;
  const tick = () => { runSec = (performance.now() - runT0) / 1000; showTimer(); setCount(); runRaf = requestAnimationFrame(tick); };
  tick();
}
function stopRunTimer(sec) { cancelAnimationFrame(runRaf); runRaf = 0; if (sec != null) runSec = sec; showTimer(); setCount(); }

// ---------- transcript strip ----------
function showText(text, cls = '') {
  wordsEl.className = 'words ' + cls;
  wordsEl.textContent = text;
  lineEl.classList.toggle('overflow', wordsEl.scrollWidth > lineEl.clientWidth);
}
function setListening(on) { frame.classList.toggle('is-listening', on); $('micBtn').setAttribute('aria-pressed', on); }

// ---------- provider ----------
function setProvider(p, animate) {
  provider = p;
  if (!animate) frame.classList.add('instant');
  frame.classList.toggle('prov-fast', p === 'fast');
  frame.classList.toggle('prov-slow', p !== 'fast');
  if (animate) restartAnim(sw, 'stamp');
  else { void frame.offsetWidth; frame.classList.remove('instant'); }
}
function flipProvider() {
  if (running) abortRun?.abort();
  setProvider(provider === 'fast' ? 'slow' : 'fast', true);
  $('done').classList.remove('show');
  clearCards(true);
  if (!countdown) { stopRunTimer(0); restartAnim(timerEl, 'reset'); } else { runSec = 0; setCount(); }
  showText('');
}

// ---------- run: send the list to OpenClaw and land cards as lines stream in ----------
async function send(text, resent) {
  text = text.trim();
  if (!text || running) return;
  lastText = text;
  if (resent) { restartAnim($('resent'), 'show'); showText(text); }
  const side = provider;
  lastSentOn = side;
  running = true;
  $('done').classList.remove('show');
  buildCards(CFG.slots);
  cards.forEach(c => c.className = 'card is-loading');
  startCountdown();
  startRunTimer();
  const ctrl = new AbortController(); abortRun = ctrl;
  let got = 0, err = null;
  try {
    const r = await fetch('/api/run', { method: 'POST', signal: ctrl.signal, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ provider: CFG.providers[side].id, text }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
        if (msg.type === 'gift') { got++; fill(msg); }
        if (msg.type === 'error') err = msg.message;
      }
    }
  } catch (e) { if (!ctrl.signal.aborted) err = String(e.message || e); }
  running = false;
  if (ctrl.signal.aborted) return;
  const sec = (performance.now() - runT0) / 1000;
  stopRunTimer(sec);
  // drop the placeholders left over when fewer people came back than slots
  cards.filter(c => !c.classList.contains('is-filled')).forEach(c => c.remove());
  cards = [...grid.children];
  if (cards.length) grid.style.gridTemplateRows = `repeat(${Math.ceil(cards.length / 2)}, minmax(0, 1fr))`;
  setCount();
  if (err || !got) { showText(err ? `Error: ${err}` : 'No gifts came back. Try again.', 'error'); return; }
  times[side] = sec;
  $('doneTime').textContent = `all ${filled()} gifts in ${fmt(sec)}`;
  restartAnim($('done'), 'show');
  if (side === 'fast') { cdFrozen = cdT0 == null ? null : CFG.countdownStart - (performance.now() - cdT0) / 1000; showTimer(); }
}

// ---------- voice (Chrome Web Speech API) ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = '';
function toggleMic() {
  if (rec) { rec.stop(); return; }   // stopping sends what you said (onend)
  if (running) return;
  if (!SR) { showText('No speech input in this browser: type the list in the bar above.', 'error'); return; }
  finalText = '';
  rec = new SR();
  rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript + ' ';
      else interim += e.results[i][0].transcript;
    }
    showText((finalText + interim).trim());
  };
  rec.onerror = e => { if (e.error !== 'no-speech' && e.error !== 'aborted') showText(`Mic error: ${e.error}`, 'error'); };
  rec.onend = () => { rec = null; setListening(false); const t = finalText.trim(); if (t) send(t, false); };
  rec.start();
  setListening(true);
  showText('');
  startCountdown();
}

// ---------- end card (E) ----------
function showEnd(on) {
  endShown = on;
  frame.classList.toggle('state-end', on);
  $('endBtn').setAttribute('aria-pressed', on);
  if (!on) return;
  const fast = times.fast, slow = times.slow, n = filled();
  // the metric is named on screen: time from send to all gifts found (organizers' checklist)
  if (countdown && cdFrozen != null) {
    $('big').textContent = fmtClock(cdFrozen);
    $('vsnum').textContent = 'to spare';
    $('vsline').textContent = `all ${n} gifts found in ${fmt(fast)} on ${CFG.providers.fast.label}`;
    $('allline').textContent = slow ? `${fmt(slow)} on ${CFG.providers.slow.label} · ${CFG.model}` : CFG.model;
  } else {
    $('big').textContent = fmt(fast);
    $('vsnum').textContent = slow ? `vs ${fmt(slow)}` : '';
    $('vsline').textContent = `time to find all ${n} gifts` + (slow ? `, ${CFG.providers.fast.label} vs ${CFG.providers.slow.label}` : ` on ${CFG.providers.fast.label}`);
    $('allline').textContent = `${CFG.model} · same list, same model`;
  }
}

function resetAll() {
  abortRun?.abort(); running = false;
  if (rec) { rec.onend = null; rec.abort(); rec = null; setListening(false); }
  cancelAnimationFrame(cdRaf); cdT0 = null; cdFrozen = null;
  times.slow = times.fast = null; lastText = ''; runSec = 0;
  showEnd(false); setProvider('slow', false); buildCards(CFG.slots); stopRunTimer(0); showText('');
}
function applyFlags() {
  frame.classList.toggle('show-strip', strip);
  frame.classList.toggle('countdown', countdown);
  frame.classList.toggle('reduced', reduced);
  $('stripBtn').setAttribute('aria-pressed', strip);
  $('cdBtn').setAttribute('aria-pressed', countdown);
  showTimer(); setCount();
}

// ---------- controls ----------
function command(k) {
  if (k === ' ') toggleMic();
  else if (k === 'enter') { if (lastText) send(lastText, lastSentOn !== provider); }
  else if (k === 's') flipProvider();
  else if (k === 'e') showEnd(!endShown);
  else if (k === 'k') { countdown = !countdown; applyFlags(); }
  else if (k === 't') { strip = !strip; applyFlags(); }
  else if (k === 'm') { reduced = !reduced; applyFlags(); }
  else if (k === 'r') resetAll();
  else if (k === 'h') { document.body.classList.toggle('clean'); fit(); }
  else return false;
  return true;
}
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
  if (e.target === $('typed')) {
    if (e.key === 'Enter') { const t = $('typed').value; $('typed').value = ''; $('typed').blur(); showText(t); send(t, false); e.preventDefault(); }
    return;
  }
  if (command(e.key.toLowerCase())) e.preventDefault();
});
// click a gift to open its real product page (shows the result working)
grid.addEventListener('click', e => {
  const c = e.target.closest('.card.is-filled');
  if (c?.dataset.url) window.open(c.dataset.url, '_blank', 'noopener');
});
$('micBtn').onclick = () => command(' ');
$('againBtn').onclick = () => command('enter');
$('prov').onclick = () => command('s');
$('endBtn').onclick = () => command('e');
$('cdBtn').onclick = () => command('k');
$('stripBtn').onclick = () => command('t');
$('resetBtn').onclick = () => command('r');

// ---------- fit: exact 1080x960 physical pixels when ?record=1, scaled to fit otherwise ----------
const q = new URLSearchParams(location.search);
const RECORD = q.get('record') === '1';
function fit() {
  const tbh = document.body.classList.contains('clean') ? 0 : $('toolbar').offsetHeight;
  document.documentElement.style.setProperty('--toolbar-h', tbh + 'px');
  const wrap = $('wrap'), stage = $('stage');
  if (RECORD) {
    const s = 1 / (window.devicePixelRatio || 1);   // exact physical pixels even with Windows display scaling
    wrap.style.transform = s === 1 ? 'none' : `scale(${s})`; wrap.style.left = '0px'; wrap.style.top = '0px';
    return;
  }
  const pad = document.body.classList.contains('clean') ? 0 : 24;
  const w = stage.clientWidth - pad * 2, h = stage.clientHeight - pad * 2;
  const s = Math.min(w / 1080, h / 960);
  wrap.style.transform = `scale(${s})`;
  wrap.style.left = ((stage.clientWidth - 1080 * s) / 2) + 'px';
  wrap.style.top = ((stage.clientHeight - 960 * s) / 2) + 'px';
}
window.addEventListener('resize', fit);

if (q.get('clean') === '1' || RECORD) document.body.classList.add('clean');
if (RECORD) document.body.classList.add('record');
if (q.get('countdown') === '1') countdown = true;
if (q.get('strip') === '0') strip = false;
if (q.get('reduced') === '1') reduced = true;
if (q.get('provider') === 'fast') provider = 'fast';
setProvider(provider, false);
buildCards(CFG.slots);
applyFlags();
fit();
</script>
